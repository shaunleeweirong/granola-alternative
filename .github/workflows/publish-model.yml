name: Publish the models

# Copies the models the app downloads into this repository's own Releases, under
# a fixed `models` tag, so the app has a stable URL to fetch from.
#
# Why not just point the app at Hugging Face? It rate limits, and it is blocked
# on a good number of corporate networks. That is precisely where a meeting
# recorder runs. Hugging Face stays as the app's fallback source; this is the
# one it tries first.
#
# Run it once per model. It only needs running again when a model in
# src/core/models/catalog.ts changes.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Which model to publish"
        type: choice
        options: [speech, language, both]
        default: both

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Read the models from the app's catalog
        # Single source of truth: the file names and fallback URLs come from the
        # same place the app reads them, so the two cannot drift apart.
        id: catalog
        env:
          WANTED: ${{ inputs.model }}
        run: |
          set -euo pipefail
          node --experimental-strip-types -e '
            import("./src/core/models/catalog.ts").then(({ MODELS }) => {
              const wanted = process.env.WANTED === "both"
                ? ["speech", "language"]
                : [process.env.WANTED];
              const rows = wanted.map((kind) => {
                const spec = MODELS[kind];
                if (!spec) throw new Error(`no model of kind ${kind} in the catalog`);
                const upstream = spec.urls.find((u) => u.includes("huggingface.co"));
                if (!upstream) throw new Error(`${kind} has no upstream source`);
                return { kind, file: spec.fileName, url: upstream, min: spec.minBytes };
              });
              process.stdout.write(`models=${JSON.stringify(rows)}\n`);
            });
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Fetch, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS: ${{ steps.catalog.outputs.models }}
        run: |
          set -euo pipefail

          gh release create models \
            --title "Speech and language models" \
            --notes "Models downloaded by Meeting Notes on demand. Not an app release." \
            || echo "the models release already exists"

          echo "$MODELS" | jq -c '.[]' | while read -r row; do
            kind=$(echo "$row" | jq -r .kind)
            file=$(echo "$row" | jq -r .file)
            url=$(echo "$row" | jq -r .url)
            min=$(echo "$row" | jq -r .min)

            echo "::group::$kind — $file"
            curl -fL --retry 3 --retry-delay 5 "$url" -o "$file"

            # A 404 page saved under the right name would pass a plain existence
            # check, so apply the same two tests the app applies.
            size=$(stat -c%s "$file")
            if [ "$size" -lt "$min" ]; then
              echo "::error::$file is only $size bytes, below the catalog's floor of $min"
              head -c 400 "$file"
              exit 1
            fi
            magic=$(head -c 4 "$file")
            case "$magic" in
              lmgg|GGUF) ;;
              *) echo "::error::$file does not start with a model header (got '$magic')"; exit 1 ;;
            esac

            sha=$(sha256sum "$file" | cut -d' ' -f1)
            echo "$sha  $file" > "$file.sha256.txt"
            gh release upload models "$file" "$file.sha256.txt" --clobber

            {
              echo "### $kind: \`$file\`"
              echo
              echo "SHA-256: \`$sha\`"
              echo
              echo "Pin this in \`src/core/models/catalog.ts\` as that model's \`sha256\`."
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            rm -f "$file"
            echo "::endgroup::"
          done
