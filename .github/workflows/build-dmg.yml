name: Build macOS app

# Produces an installable .dmg on GitHub's own Mac hardware. Two reasons this
# cannot happen anywhere else: the system-audio helper is Swift and needs
# swiftc, and a .dmg needs macOS to assemble.
#
# Run it from the Actions tab with "Run workflow", or push a v* tag to also
# publish a Release.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub Release with the .dmg"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # The speech model is NOT bundled. At 874 MB it dwarfed everything else in
  # the installer, and welding it into the app meant every bug fix cost another
  # full download of it. The app fetches it once on first launch instead; see
  # src/core/models/catalog.ts and publish-model.yml.
  #
  # There is no Apple Developer certificate in this repository, so stop
  # electron-builder hunting for one and failing. The app is ad-hoc signed
  # below instead, which is the minimum Apple Silicon will run at all.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    # Apple Silicon runner. The app itself requires macOS 14.2 or later to run.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        # A broken build should never reach a .dmg.
        run: npm run verify

      - name: Build the system audio helper
        run: |
          npm run build:tap
          test -x resources/bin/meeting-audio-tap || {
            echo "::error::The Swift audio helper did not build"; exit 1;
          }

      - name: Cache the speech engine build
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: .cache/whisper.cpp
          key: whisper-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Build the speech engine
        run: |
          set -euo pipefail
          mkdir -p .cache

          # A restored cache can leave the directory present but incomplete, and
          # git clone refuses to write into a non-empty directory. Start clean
          # unless there is a real repository here.
          if [ -d .cache/whisper.cpp ] && [ ! -d .cache/whisper.cpp/.git ]; then
            echo "whisper.cpp directory exists without a repository; starting fresh"
            rm -rf .cache/whisper.cpp
          fi

          if [ ! -d .cache/whisper.cpp/.git ]; then
            git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git .cache/whisper.cpp
          fi
          # BUILD_SHARED_LIBS defaults to ON on macOS, which links the server
          # against libwhisper and several libggml dylibs that live in the build
          # tree. Copying only the binary into the app leaves those behind and
          # it dies at launch. Static linking makes the binary self-contained.
          cmake -S .cache/whisper.cpp -B .cache/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_SERVER=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build .cache/whisper.cpp/build --config Release -j "$(sysctl -n hw.ncpu)"

          mkdir -p resources/bin
          server=$(find .cache/whisper.cpp/build -name whisper-server -type f -perm -u+x | head -1)
          test -n "$server" || { echo "::error::no whisper-server binary produced"; exit 1; }
          cp "$server" resources/bin/whisper-server
          chmod +x resources/bin/whisper-server

          bash scripts/assert-standalone.sh resources/bin/whisper-server whisper-server .cache

      - name: Cache the language engine build
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: .cache/llama.cpp
          key: llama-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Build the language engine
        run: |
          set -euo pipefail
          mkdir -p .cache

          # Same guard as whisper.cpp: a restored cache can leave the directory
          # present but without a repository in it, and git refuses to clone
          # into a non-empty directory.
          if [ -d .cache/llama.cpp ] && [ ! -d .cache/llama.cpp/.git ]; then
            echo "llama.cpp directory exists without a repository; starting fresh"
            rm -rf .cache/llama.cpp
          fi

          if [ ! -d .cache/llama.cpp/.git ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git .cache/llama.cpp
          fi

          # BUILD_SHARED_LIBS=OFF makes llama.cpp's OWN libraries static. It says
          # nothing about third-party ones, and LLAMA_OPENSSL defaults to ON,
          # which links Homebrew's OpenSSL from /opt/homebrew. That exists on
          # this runner and shipped a binary that aborts on launch: even on a
          # Mac that has Homebrew, the hardened runtime refuses to load a dylib
          # signed by a different team. Nothing here needs HTTPS, since the
          # server binds to loopback and the app downloads models itself.
          cmake -S .cache/llama.cpp -B .cache/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build .cache/llama.cpp/build --config Release -j "$(sysctl -n hw.ncpu)"

          mkdir -p resources/bin
          server=$(find .cache/llama.cpp/build -name llama-server -type f -perm -u+x | head -1)
          test -n "$server" || { echo "::error::no llama-server binary produced"; exit 1; }
          cp "$server" resources/bin/llama-server
          chmod +x resources/bin/llama-server

          bash scripts/assert-standalone.sh resources/bin/llama-server llama-server .cache

      - name: Build the app bundle
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --mac dir --arm64

          # electron-builder names the output folder by architecture, and that
          # has changed between versions. Find the bundle rather than guess it.
          app=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          test -n "$app" || { echo "::error::no .app bundle produced"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "Built $app"

      - name: Ad-hoc sign the app
        # Without a signature Apple Silicon refuses to launch the app at all,
        # and macOS ties recording permissions to the signature. An ad-hoc
        # signature is free and enough for a private test build; it is NOT
        # notarisation, so Gatekeeper still warns on first open.
        run: |
          set -euo pipefail
          app="$APP_PATH"
          test -d "$app" || { echo "::error::app bundle not found at $app"; exit 1; }

          # Inner binaries must be signed before the bundle that contains them.
          find "$app/Contents/Resources/bin" -type f -perm -u+x -print0 2>/dev/null |
            while IFS= read -r -d '' binary; do
              codesign --force --sign - --timestamp=none --options runtime "$binary"
            done

          find "$app" -name "*.node" -print0 |
            while IFS= read -r -d '' native; do
              codesign --force --sign - --timestamp=none "$native"
            done

          find "$app/Contents/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.app" \) -print0 2>/dev/null |
            while IFS= read -r -d '' item; do
              codesign --force --sign - --timestamp=none --options runtime \
                --entitlements build/entitlements.mac.plist "$item"
            done

          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements build/entitlements.mac.plist "$app"

      - name: Verify the signature and the bundled parts
        run: |
          set -euo pipefail
          app="$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee /tmp/sig.txt
          grep -q "Signature=adhoc" /tmp/sig.txt || {
            echo "::error::app is not signed; Apple Silicon will refuse to launch it"; exit 1;
          }

          for required in \
            "Contents/Resources/bin/meeting-audio-tap" \
            "Contents/Resources/bin/whisper-server" \
            "Contents/Resources/bin/llama-server"; do
            test -e "$app/$required" || { echo "::error::missing $required"; exit 1; }
          done

          # The model must NOT be in here. Shipping one by accident would put
          # the gigabyte straight back into every download.
          if [ -d "$app/Contents/Resources/models" ]; then
            echo "::error::a model was bundled into the app; it is meant to be downloaded on first launch"
            ls -lh "$app/Contents/Resources/models"
            exit 1
          fi

          # The binary must run from where it will actually live, after
          # copying, signing and hardened-runtime entitlements.
          # Signed, inside the bundle, and with the build tree hidden: the
          # closest this runner can get to someone else's Mac.
          for engine in whisper-server llama-server; do
            bash scripts/assert-standalone.sh \
              "$app/Contents/Resources/bin/$engine" "the bundled $engine" .cache
          done

          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$plist" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSAudioCaptureUsageDescription" "$plist" >/dev/null
          echo "Bundle contents and permission strings verified."

      - name: Build the .dmg
        run: npx electron-builder --mac dmg --arm64 --prepackaged "$APP_PATH"

      - name: Name the .dmg by commit
        id: artifact
        run: |
          set -euo pipefail
          dmg=$(find release -maxdepth 1 -name "*.dmg" | head -1)
          test -n "$dmg" || { echo "::error::no .dmg produced"; exit 1; }
          final="release/MeetingNotes-arm64-${GITHUB_SHA::7}.dmg"
          mv "$dmg" "$final"
          shasum -a 256 "$final" | tee "$final.sha256.txt"
          echo "path=$final" >> "$GITHUB_OUTPUT"
          ls -lh "$final"

          # Without the model this should be around 110 MB. If it creeps back
          # towards a gigabyte, something is being bundled that should not be.
          bytes=$(stat -f%z "$final")
          mb=$((bytes / 1024 / 1024))
          echo "### Installer: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 400 ]; then
            echo "::warning::the installer is ${mb} MB; it should be about 110 MB without a bundled model"
          fi

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-macOS-arm64
          path: |
            release/*.dmg
            release/*.sha256.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish a Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            tag="build-${GITHUB_SHA::7}"
            # --target matters: without it gh tags the DEFAULT branch's head,
            # so the release shows a commit that is not the one that was built.
            # That is exactly how a correct .dmg came to look like a stale one.
            gh release create "$tag" --target "$GITHUB_SHA" --title "Test build ${GITHUB_SHA::7}" --notes \
              "Unsigned test build for Apple Silicon Macs running macOS 14.2 or later. See the install notes in docs/INSTALL-DMG.md." \
              || echo "Release $tag already exists"
          fi
          gh release upload "$tag" release/*.dmg release/*.sha256.txt --clobber
